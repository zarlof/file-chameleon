<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- File Chameleon app icon: a green chameleon on a brown folder (original artwork). -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a6533"/>
      <stop offset="1" stop-color="#6e4420"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d49a5a"/>
      <stop offset="0.55" stop-color="#bf8143"/>
      <stop offset="1" stop-color="#a46a33"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe3cc"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be06f"/>
      <stop offset="0.5" stop-color="#43c158"/>
      <stop offset="1" stop-color="#23933f"/>
    </linearGradient>
    <linearGradient id="skinDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3dac4f"/>
      <stop offset="1" stop-color="#1d7a35"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#b9f5a3"/>
      <stop offset="1" stop-color="#4cc25c"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2b1606" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#3b2208" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Folder -->
  <g filter="url(#shadow)">
    <path fill="url(#back)" d="M176 172H380Q414 172 436 198L468 236H848Q916 236 916 304V808Q916 876 848 876H176Q108 876 108 808V240Q108 172 176 172Z"/>
    <path fill="url(#paper)" d="M164 292Q164 268 188 268H836Q860 268 860 292V420H164Z"/>
    <path fill="url(#front)" d="M168 336H856Q916 336 916 396V808Q916 876 848 876H176Q108 876 108 808V396Q108 336 168 336Z"/>
    <path fill="none" stroke="#e9b77c" stroke-opacity="0.7" stroke-width="6" d="M170 340H854Q910 340 912 392"/>
  </g>

  <!-- Twig -->
  <path fill="none" stroke="#5a3616" stroke-width="30" stroke-linecap="round" d="M196 744C360 724 560 722 840 736"/>
  <path fill="none" stroke="#86562a" stroke-width="9" stroke-linecap="round" d="M214 736C370 718 560 716 822 728"/>

  <g filter="url(#soft)">
    <!-- Tail: a spiral curl -->
    <path fill="none" stroke="url(#skinDark)" stroke-width="50" stroke-linecap="round"
          d="M672 560C748 548 826 596 830 682C834 762 762 806 708 784C658 764 652 700 694 674"/>
    <path fill="none" stroke="url(#skinDark)" stroke-width="34" stroke-linecap="round"
          d="M694 674C728 654 770 680 764 716C760 742 732 748 720 732"/>
    <!-- Back legs -->
    <path fill="none" stroke="#2a9442" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" d="M628 640L664 690L640 728"/>
    <!-- Body -->
    <path fill="url(#skin)" d="M402 540C430 452 534 414 620 440C690 462 724 520 704 580C690 628 640 664 560 668C482 672 420 650 400 610Z"/>
    <!-- Dorsal crest -->
    <path fill="#2f9f47" d="M440 486Q452 452 474 470Q488 438 512 456Q530 428 552 448Q574 424 594 446Q620 430 634 456Q662 450 668 480Q610 452 540 458Q480 466 440 486Z"/>
    <!-- Side stripe -->
    <path fill="none" stroke="#a8f08f" stroke-opacity="0.75" stroke-width="16" stroke-linecap="round" d="M448 592C520 616 610 612 676 578"/>
    <!-- Front legs -->
    <path fill="none" stroke="#2fa047" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" d="M470 640L452 692L478 728"/>
    <!-- Head -->
    <path fill="url(#skin)" d="M244 574C248 534 296 488 352 466C392 448 424 426 456 404C474 462 476 540 448 604C424 640 356 652 300 636C266 626 242 604 244 574Z"/>
    <!-- Casque ridge -->
    <path fill="none" stroke="#2a9442" stroke-width="11" stroke-linecap="round" d="M330 482C372 462 414 438 452 410"/>
    <!-- Mouth -->
    <path fill="none" stroke="#1d6f30" stroke-width="10" stroke-linecap="round" d="M254 586C300 604 352 606 400 590"/>
    <!-- Eye turret -->
    <circle cx="352" cy="540" r="50" fill="url(#eye)" stroke="#2a9442" stroke-width="10"/>
    <circle cx="338" cy="536" r="19" fill="#13240f"/>
    <circle cx="331" cy="529" r="6.5" fill="#ffffff"/>
    <!-- Feet -->
    <circle cx="478" cy="730" r="16" fill="#2fa047"/>
    <circle cx="640" cy="730" r="16" fill="#2a9442"/>
  </g>
</svg>
