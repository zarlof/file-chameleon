name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installer for the in-app updater (latest.json + .sig are attached).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: File Chameleon ${{ github.ref_name }}
          releaseBody: See the README for what's new. Checksums are attached as .sha256 files.
          releaseDraft: false
          prerelease: false

      - name: Attach SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as data, never pasted into the script (a tag name could carry code).
          TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem -Recurse target/release/bundle/nsis -Filter *.exe
          foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"
            gh release upload "$env:TAG" "$($f.FullName).sha256" --clobber
          }
