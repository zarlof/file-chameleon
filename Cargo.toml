[workspace]
members = ["crates/fc-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["File Chameleon contributors"]
repository = "https://github.com/zarlof/file-chameleon"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
fc-core = { path = "crates/fc-core" }

# Size-first release profile ("z": ~2 MB smaller exe than "s"; heavy media work runs in ffmpeg). panic stays "unwind" on purpose: a converter must
# survive a decoder panic on a malformed file (caught per job with catch_unwind).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# Dev builds: line tables only for our crates and no debug info for dependencies. Full debug
# info made each target folder 5-15 GB (one per worktree), with almost no benefit here.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
