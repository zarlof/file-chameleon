[workspace]
members = ["crates/fc-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["File Chameleon contributors"]
repository = "https://github.com/file-chameleon/file-chameleon"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fc-core = { path = "crates/fc-core" }

# Size-first release profile. panic stays "unwind" on purpose: a converter must
# survive a decoder panic on a malformed file (caught per job with catch_unwind).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
