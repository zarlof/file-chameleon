[package]
name = "fc-core"
description = "File Chameleon core: format registry, conversion engines, jobs, engine manager, downloader, clipboard history. No Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Engines (minimal feature sets to keep the binary small)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp"] }
webp = { version = "0.3", default-features = false }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
lopdf = { version = "0.47", default-features = false }
pdfium-render = { version = "0.9", default-features = false, features = ["thread_safe", "image_latest", "pdfium_latest"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
csv = "1.4"
serde_yaml = "0.9"
toml = { version = "1.2", features = ["preserve_order"] }

# Engine manager / downloader
ureq = { version = "3.5", default-features = false, features = ["native-tls"] }
sha2 = "0.11"
zip = { version = "9.7", default-features = false, features = ["deflate"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
