[package]
name = "file-chameleon"
description = "File Chameleon: offline file converter, media downloader and smart clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "file-chameleon"

[lib]
name = "file_chameleon_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
fc-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# Clipboard v2 (Task 9): OCR input and watched image folders. Wheel thumbnails and the image
# editor's preview / save (Task 6). Same crate, version and features fc-core already builds, so
# nothing new is compiled.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["monitor"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Clipboard v2 (Task 9): Windows OCR (WinRT) on a worker thread.
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
